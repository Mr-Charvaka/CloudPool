version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudpool-postgres
    environment:
      POSTGRES_DB: cloudpool
      POSTGRES_USER: cloudpool
      POSTGRES_PASSWORD: cloudpool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpool"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudpool-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cloudpool-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  weaviate:
    image: semitechnologies/weaviate:1.21.2
    container_name: cloudpool-weaviate
    ports:
      - "8081:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ../backend/spring-boot/cloudpool-gateway
      dockerfile: Dockerfile
    container_name: cloudpool-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CLOUDPOOL_SERVICES_AUTH_URL: http://auth:8082
      CLOUDPOOL_SERVICES_DATA_URL: http://data:8083
      CLOUDPOOL_SERVICES_COMPUTE_URL: http://compute:8084
      CLOUDPOOL_SERVICES_NETWORK_URL: http://network:8085
    depends_on:
      - auth
      - data
      - compute
      - network

  auth:
    build:
      context: ../backend/spring-boot/cloudpool-auth
      dockerfile: Dockerfile
    container_name: cloudpool-auth
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://toxiproxy:5433/cloudpool
      SPRING_DATASOURCE_USERNAME: cloudpool
      SPRING_DATASOURCE_PASSWORD: cloudpool
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  data:
    build:
      context: ../backend/spring-boot/cloudpool-data
      dockerfile: Dockerfile
    container_name: cloudpool-data
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://toxiproxy:5433/cloudpool
      SPRING_DATASOURCE_USERNAME: cloudpool
      SPRING_DATASOURCE_PASSWORD: cloudpool
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      WEAVIATE_URL: http://weaviate:8080
    depends_on:
      postgres:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      weaviate:
        condition: service_healthy

  compute:
    build:
      context: ../backend/spring-boot/cloudpool-compute
      dockerfile: Dockerfile
    container_name: cloudpool-compute
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://toxiproxy:5433/cloudpool
      SPRING_DATASOURCE_USERNAME: cloudpool
      SPRING_DATASOURCE_PASSWORD: cloudpool
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  network:
    build:
      context: ../backend/spring-boot/cloudpool-network
      dockerfile: Dockerfile
    container_name: cloudpool-network
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://toxiproxy:5433/cloudpool
      SPRING_DATASOURCE_USERNAME: cloudpool
      SPRING_DATASOURCE_PASSWORD: cloudpool
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.5.0
    container_name: cloudpool-toxiproxy
    ports:
      - "8474:8474"
      - "5433:5433"
    volumes:
      - ./toxiproxy-config.json:/etc/toxiproxy.json
    command: -config /etc/toxiproxy.json -host 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  weaviate_data:
