apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudpool-postgres
  namespace: default
spec:
  serviceName: "postgres-headless"
  replicas: 1
  selector:
    matchLabels:
      app: cloudpool-postgres
  template:
    metadata:
      labels:
        app: cloudpool-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "cloudpool"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: cloudpool-db-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudpool-db-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi
