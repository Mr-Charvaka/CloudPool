apiVersion: v1
kind: Namespace
metadata:
  name: cloudpool
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cloudpool
spec:
  podSelector: {}
  policyTypes:
    - Ingress
