[package]
name = "cloudpool"
version = "0.1.0"
edition = "2021"
authors = ["CloudPool Contributors"]
description = "Official Rust SDK client for CloudPool platform"

[dependencies]
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
rand = "0.8"

[dev-dependencies]
