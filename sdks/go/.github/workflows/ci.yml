name: Go SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdks/go/**"
  pull_request:
    branches: [main]
    paths:
      - "sdks/go/**"

defaults:
  run:
    working-directory: sdks/go

jobs:
  build:
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Tidy
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1
