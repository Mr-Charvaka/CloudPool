[tox]
envlist = py39, py310, py311, py312, lint, typecheck
isolated_build = True
skip_missing_interpreters = True

[testenv]
deps =
    pytest>=7
    pytest-asyncio>=0.21
    pytest-cov>=4
    responses>=0.25
commands =
    pytest tests/ -v --cov=cloudpool --cov-report=term-missing

[testenv:lint]
deps = ruff>=0.1
commands = ruff check cloudpool/ tests/ examples/

[testenv:typecheck]
deps = mypy>=1.0
commands = mypy cloudpool/