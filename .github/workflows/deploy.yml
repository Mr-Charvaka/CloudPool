name: Deploy to Kubernetes

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-kubeconfig: ${{ steps.check.outputs.has-kubeconfig }}
    steps:
      - name: Check if KUBECONFIG secret is configured
        id: check
        run: |
          if [ -n "${{ secrets.KUBECONFIG }}" ]; then
            echo "has-kubeconfig=true" >> $GITHUB_OUTPUT
          else
            echo "has-kubeconfig=false" >> $GITHUB_OUTPUT
            echo "::notice::KUBECONFIG secret is not set - skipping Kubernetes deploy"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.has-kubeconfig == 'true'
    environment: production

    steps:
    - uses: actions/checkout@v7

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Record previous revision for rollback
      id: pre-deploy
      run: |
        REV=$(kubectl rollout history deployment/cloudpool-api -n cloudpool | tail -2 | head -1 | awk '{print $1}')
        echo "previous_revision=$REV" >> $GITHUB_OUTPUT
        kubectl rollout history deployment/cloudpool-api -n cloudpool

    - name: Generate SBOM with Syft
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: spdx-json
        output-file: sbom.spdx.json

    - name: Attach SBOM to release
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.spdx.json

    - name: Deploy to Kubernetes
      id: deploy
      run: |
        kubectl set image deployment/cloudpool-api \
          cloudpool-api=${{ secrets.DOCKER_USERNAME }}/cloudpool:${{ github.sha }} \
          -n cloudpool
        kubectl rollout status deployment/cloudpool-api -n cloudpool --timeout=180s

    - name: Run smoke tests
      id: smoke-test
      run: |
        kubectl run smoke-test \
          --image=curlimages/curl:latest \
          --rm -i --restart=Never \
          -- curl -sf --max-time 10 http://cloudpool-api:80/actuator/health
        kubectl run smoke-test-db \
          --image=curlimages/curl:latest \
          --rm -i --restart=Never \
          -- curl -sf --max-time 10 http://cloudpool-api:80/actuator/health/db

    - name: Rollback on failure
      if: failure() && steps.deploy.outcome == 'success'
      run: |
        echo "Smoke tests failed. Rolling back to previous revision..."
        kubectl rollout undo deployment/cloudpool-api -n cloudpool
        kubectl rollout status deployment/cloudpool-api -n cloudpool --timeout=120s
        echo "Rollback complete. Please investigate the failed deployment SHA: ${{ github.sha }}"
