name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          sdk/javascript/package-lock.json
          frontend/react-dashboard/package-lock.json
          DRAP/dashboard/ui/package-lock.json
          DRAP/DRAP-main/dashboard/ui/package-lock.json
      continue-on-error: true

    - name: Build JS SDK
      working-directory: sdk/javascript
      run: |
        npm install
        npm run build

    - name: Build React Dashboard
      working-directory: frontend/react-dashboard
      run: |
        npm install
        npm run build

    - name: Build Svelte UI (DRAP)
      working-directory: DRAP/dashboard/ui
      run: |
        npm install
        npm run build

    - name: Build Svelte UI (DRAP-main)
      working-directory: DRAP/DRAP-main/dashboard/ui
      run: |
        npm install
        npm run build

  backend-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cloudpool_test
          POSTGRES_USER: cloudpool
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U cloudpool -d cloudpool_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build Rust native library
      run: cargo build --release --manifest-path backend/rust/Cargo.toml

    - name: Run JNI Bridge Verification
      working-directory: backend/spring-boot
      run: mvn exec:java -Dexec.mainClass="com.cloudpool.util.JniTest"

    - name: Run tests
      working-directory: backend/spring-boot
      run: mvn clean test -Dspring.profiles.active=ci
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cloudpool_test
        SPRING_DATASOURCE_USERNAME: cloudpool
        SPRING_DATASOURCE_PASSWORD: password
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6379
        SPRING_RABBITMQ_HOST: localhost
        SPRING_RABBITMQ_PORT: 5672
        CLOUDPOOL_JWT_SECRET: ci-test-secret-key-minimum-32-chars-long
        CLOUDPOOL_GOOGLE_DRIVE_CLIENT_ID: dummy-client-id
        CLOUDPOOL_GOOGLE_DRIVE_CLIENT_SECRET: dummy-client-secret

    - name: Build with Maven
      working-directory: backend/spring-boot
      run: mvn clean package -DskipTests

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: backend/spring-boot/target/site/jacoco/jacoco.xml
      continue-on-error: true

    - name: Build Docker image
      run: docker build -t cloudpool:${{ github.sha }} .

    - name: Push to Docker Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        if [ -z "$DOCKER_USERNAME" ]; then
          echo "Docker credentials not provided, skipping push."
          exit 0
        fi
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        docker tag cloudpool:${{ github.sha }} "$DOCKER_USERNAME/cloudpool:${{ github.sha }}"
        docker tag cloudpool:${{ github.sha }} "$DOCKER_USERNAME/cloudpool:latest"
        docker push "$DOCKER_USERNAME/cloudpool:${{ github.sha }}"
        docker push "$DOCKER_USERNAME/cloudpool:latest"
