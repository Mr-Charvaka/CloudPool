name: "🐛 Bug Report"
description: Report a bug in CloudPool
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug!
  - type: dropdown
    id: stack
    attributes:
      label: Affected Stack / Module
      options:
        - Spring Boot (Java backend)
        - Rust (native layer / DRAP)
        - React Dashboard (frontend)
        - JavaScript SDK
        - Python SDK
        - CLI
        - DRAP Tunnel
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      placeholder: Describe what happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to...
        2. Click...
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Windows 11 / macOS 14 / Ubuntu 22.04
        Java: 21 / Node: 20 / Python: 3.11
        CloudPool version: v0.x.x
