name: "✨ Good First Issue — React / MERN"
description: A contribution task suitable for React/Node.js/MERN developers
labels: ["good first issue", "react", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        ## 👋 Welcome, React / MERN developer!

        This issue is scoped specifically for the **React Dashboard** or **JavaScript SDK**.
        You don't need to know Java or Rust — just React/TypeScript/Node.js!

        **Where to work:**
        - React Dashboard → `frontend/react-dashboard/`
        - JavaScript SDK → `sdk/javascript/`
        - Node.js CLI → `cli/`

  - type: textarea
    id: task
    attributes:
      label: Task Description
      placeholder: Describe the feature or fix needed
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] Component renders correctly
        - [ ] Connected to real CloudPool API
        - [ ] TypeScript typed (no `any`)
        - [ ] Mobile responsive
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - React Dashboard — Auth page
        - React Dashboard — Projects page
        - React Dashboard — Database Console
        - React Dashboard — Storage page
        - React Dashboard — Vector Search page
        - React Dashboard — Compute page
        - JavaScript SDK — new method
        - JavaScript SDK — bug fix
        - JavaScript SDK — tests
        - Node.js CLI
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Getting Started
        ```bash
        cd frontend/react-dashboard
        npm install && npm run dev
        ```
        Join `#react` on [Discord](https://discord.gg/gzcnkE7yN) for help!
