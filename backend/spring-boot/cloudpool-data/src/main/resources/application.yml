spring:
  application:
    name: cloudpool-data
    version: 0.1.0

  # Datasource Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:../data/cloudpooldb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # Flyway Configuration
  # {vendor} resolves automatically to the active JDBC driver (h2 or postgresql).
  # Migrations that use Postgres-only features (ROW LEVEL SECURITY, current_setting(),
  # ALTER ROLE/DATABASE session defaults) live under db/migration/postgresql and are
  # skipped entirely when running against H2 in local/dev mode.
  flyway:
    locations: classpath:db/migration,classpath:db/migration/{vendor}

  # JPA/Hibernate Configuration
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # GraphQL Configuration
  graphql:
    path: /graphql
    graphiql:
      enabled: true
      path: /graphiql

# Logging Configuration
logging:
  level:
    root: INFO
    com.cloudpool: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [traceId=%X{traceId} spanId=%X{spanId}] - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId} spanId=%X{spanId}] %logger{36} - %msg%n"
  file:
    name: logs/cloudpool-data.log
    max-size: 10MB
    max-history: 30

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Custom Application Properties
cloudpool:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  
  cors:
    allowed-origins: ${CLOUDPOOL_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://cloudpool.empirebot.in,http://*.empirebot.in}
 
  encryption:
    master-key: ${CLOUDPOOL_ENCRYPTION_MASTER_KEY}
    # Must match the value used in every other CloudPool service exactly —
    # see cloudpool-auth/application.yml for the full explanation.
    salt: ${CLOUDPOOL_ENCRYPTION_SALT}
 
  rate-limit:
    requests-per-minute: ${CLOUDPOOL_RATE_LIMIT_RPM:120}

  google-drive:
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:your-google-client-id}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:your-google-client-secret}
    redirect-uri: ${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:8080/oauth/callback}
    scopes:
      - https://www.googleapis.com/auth/drive.file
      - https://www.googleapis.com/auth/drive.metadata.readonly

  weaviate:
    url: ${WEAVIATE_URL:http://localhost:8081}
    api-key: ${WEAVIATE_API_KEY:}

  openai:
    api-key: ${OPENAI_API_KEY:}
    model: text-embedding-ada-002

  storage:
    max-file-size: 5368709120
    allowed-extensions:
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt
      - jpg
      - jpeg
      - png
      - gif
      - zip
      - rar

  pagination:
    default-page-size: 20
    max-page-size: 100

# Server Configuration
# CRITICAL: This is a SINGLE top-level server: key. The original file had a malformed
# nested structure where server.* properties were incorrectly nested under spring.server
# (which is not a valid Spring Boot property path) AND also defined as top-level server: blocks.
# YAML doesn't merge; the last occurrence wins. This meant the configured port: 8083,
# servlet.context-path, and max-http-post-size were being discarded.
# 
# The original issues were:
#   1. Lines 20-23: spring.server.port (INVALID - server.* must be top-level)
#   2. Lines 148-152: top-level server: block (CORRECT location)
# 
# Fixed by consolidating into ONE top-level server: block with all distinct settings.
server:
  port: 8083
  servlet:
    context-path: /
    max-http-post-size: 10485760
  forward-headers-strategy: FRAMEWORK
