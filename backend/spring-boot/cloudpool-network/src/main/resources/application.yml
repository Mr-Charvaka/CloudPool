spring:
  application:
    name: cloudpool-network
    version: 0.1.0

  # Datasource Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cloudpool}
    username: ${SPRING_DATASOURCE_USERNAME:cloudpool}
    password: ${SPRING_DATASOURCE_PASSWORD:cloudpool}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # JPA/Hibernate Configuration
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # Flyway disabled — schema managed by cloudpool-data module
  flyway:
    enabled: false

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# Logging Configuration
logging:
  level:
    root: INFO
    com.cloudpool: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [traceId=%X{traceId} spanId=%X{spanId}] - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId} spanId=%X{spanId}] %logger{36} - %msg%n"
  file:
    name: logs/cloudpool-network.log
    max-size: 10MB
    max-history: 30

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Custom Application Properties
cloudpool:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  
  cors:
    allowed-origins: ${CLOUDPOOL_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://cloudpool.empirebot.in,http://*.empirebot.in}
 
  encryption:
    master-key: ${CLOUDPOOL_ENCRYPTION_MASTER_KEY}
    # Must match the value used in every other CloudPool service exactly —
    # see cloudpool-auth/application.yml for the full explanation.
    salt: ${CLOUDPOOL_ENCRYPTION_SALT}
 
  rate-limit:
    requests-per-minute: ${CLOUDPOOL_RATE_LIMIT_RPM:120}

  drap:
    executable-path: ${CLOUDPOOL_DRAP_PATH:d:/D/RESUME PROJECTS/Cloud Pool/Student-Researcher/DRAP/target/release/drap-client.exe}
    enabled: true

server:
  port: 8085
  servlet:
    context-path: /
  forward-headers-strategy: FRAMEWORK
